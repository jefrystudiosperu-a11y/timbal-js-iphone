<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Timbal JS</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>TIMBAL JS</b><span>JEFRY STUDIOS</span></div><button id="start">ACTIVAR AUDIO</button></header>
<main>
<section class="accessories"><button class="pad red" data-sound="jam">JAM BLOCK</button><button class="pad steel" data-sound="chacha">CHA CHA</button><button class="pad gold" data-sound="cowbell">CENCERRO</button><button class="pad cym" data-sound="cymbal">PLATILLO</button><button class="pad cym2" data-sound="cup">COPA</button></section>
<section class="drums"><div class="drum"><button class="rim" data-sound="cascaraG">CÁSCARA GRAVE</button><button class="head lower" data-sound="grave">PARCHE GRAVE</button></div><div class="drum"><button class="rim" data-sound="cascaraA">CÁSCARA AGUDA</button><div class="split agudo-pads"><button class="head" data-sound="center">PARCHE CENTRO</button><button class="head" data-sound="rimshot">PARCHE AGUDO<br><small>RIMSHOT</small></button></div></div></section>
</main><footer><span id="status">Toca “ACTIVAR AUDIO” una vez.</span><label>MASTER <input id="master" type="range" min="0" max="1.2" value="0.9" step="0.01"></label></footer>
<script src="app.js"></script></body></html>
